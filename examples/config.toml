# Select this file with: nalcos --config examples/config.toml ...
version = 1

# Fresh init uses coderank with automatic device selection.
# This named profile demonstrates the pinned FP16 settings.
# Uncomment to select it on initial setup; changing this value requests a switch.
# An unchanged default does not override a persisted CLI --model choice.
# default_model = "coderank"
# Or select the custom profile below with: default_model = "profile:coderank"

# NALCOS_DATA_DIR overrides this optional index-storage location.
# data_dir = "/path/to/nalcos-data"

[index]
# Exclusions apply to historical paths, including files no longer in the worktree.
exclude_paths = []
max_blob_bytes = 1048576
max_patch_bytes = 2097152
max_document_bytes = 16384
chunk_overlap_tokens = 32

[search]
candidate_limit = 100
rrf_k = 60.0
lexical_weight = 1.0
semantic_weight = 1.0

[runtime]
# auto defers to the profile device; --device overrides both workload settings.
query_device = "auto"
index_device = "auto"
threads = 4
batch_size = 8
# Optional compatible ONNX Runtime library (macOS requires 1.23.2 or newer).
# ort_library = "/path/to/libonnxruntime.dylib"

[profiles.coderank]
id = "handwoven8588/CodeRankEmbed-GGUF"
revision = "14be4104a35a5f4e32e6e225955ccf271fb5b956"
artifact = "CodeRankEmbed-f16.gguf"
backend = "gguf"
dimensions = 768
max_tokens = 512
pooling = "cls"
query_prefix = "Represent this query for searching relevant code: "
document_prefix = ""
extra_files = []
device = "auto"
